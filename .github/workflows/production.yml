name: Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  checks:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    outputs:
      lint-status: ${{ steps.lint.outcome }}
      types-status: ${{ steps.types.outcome }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run code checks
        id: lint
        run: bun run check:code

      - name: Run type checks
        id: types
        run: bun run check:types

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: checks
    if: needs.checks.outputs.lint-status == 'success' && needs.checks.outputs.types-status == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate auth files
        run: bun run build:auth

      - name: Build application
        run: bun run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/
          retention-days: 90

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [checks, build]
    if: needs.checks.outputs.lint-status == 'success' && needs.checks.outputs.types-status == 'success'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: dist/

      - name: Deploy to production
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
        # npx vercel deploy --prod --token $VERCEL_TOKEN --cwd ./apps/webapp
        # DEPLOYMENT_URL=$(npx vercel deploy --prod --token $VERCEL_TOKEN --cwd ./apps/webapp)
        # echo "deployment-url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
        # echo "✅ Production deployed successfully to $DEPLOYMENT_URL"

  notify-status:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [checks, build, deploy-production]
    if: always()
    steps:
      - name: Notify success
        if: needs.deploy-production.result == 'success'
        run: |
          echo "🎉 Production deployment successful!"
          echo "URL: ${{ needs.deploy-production.outputs.deployment-url }}"

      - name: Notify failure
        if: needs.deploy-production.result == 'failure' || needs.build.result == 'failure' || needs.checks.result == 'failure'
        run: |
          echo "❌ Production deployment failed!"
          exit 1